[workspace]
resolver = "2"
members = [
    "crates/quietwire-crypto",
    "crates/quietwire-crypto-memtest",
    "crates/quietwire-e2e",
    "crates/quietwire-packet",
    "crates/quietwire-route",
    "crates/quietwire-store",
    "crates/quietwire-transport",
    "crates/quietwire-core",
    "crates/quietwire-ffi",
    "apps/node",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/janpenitent/quietwire"
authors = ["Janier Rodríguez <jrodriguez@virtualcable.es>"]
publish = false

[workspace.dependencies]
quietwire-crypto = { path = "crates/quietwire-crypto" }
quietwire-crypto-memtest = { path = "crates/quietwire-crypto-memtest" }
quietwire-e2e = { path = "crates/quietwire-e2e" }
quietwire-packet = { path = "crates/quietwire-packet" }
quietwire-route = { path = "crates/quietwire-route" }
quietwire-store = { path = "crates/quietwire-store" }
quietwire-transport = { path = "crates/quietwire-transport" }
quietwire-core = { path = "crates/quietwire-core" }
uniffi = "=0.28.3"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
ml-kem = { version = "=0.3.2", default-features = false, features = ["hazmat", "zeroize"] }
region = "=4.0.0"
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = "=2.6.1"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
zeroize = "=1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "=1.0.121"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[workspace.metadata.vet]
store = { path = "./vet" }
