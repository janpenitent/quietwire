# QW-C-SYS-343. Duplicate versions are denied workspace-wide, a strict
# superset of the crypto-only rule, until a non-crypto exemption is needed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "Crypto comes from audited RustCrypto and dalek crates only" },
    { crate = "openssl-sys", reason = "Crypto comes from audited RustCrypto and dalek crates only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
