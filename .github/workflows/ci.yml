name: ci

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-09-20

jobs:
  lint:
    name: fmt · clippy · deny · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny,cargo-audit,cargo-vet@0.10.2
      - run: cargo deny check
      - run: cargo audit
      - run: cargo vet --locked

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/fuzz
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny
      - run: cargo +"$FUZZ_TOOLCHAIN" fmt --manifest-path tools/fuzz/Cargo.toml --all --check
      - run: cargo +"$FUZZ_TOOLCHAIN" clippy --manifest-path tools/fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo deny --manifest-path tools/fuzz/Cargo.toml --locked check
      - name: 60 s per target
        run: |
          for target in x3dh_bundle x3dh_initial_message ratchet_header ratchet_session; do
            cargo +"$FUZZ_TOOLCHAIN" fuzz run --fuzz-dir tools/fuzz "$target" -- \
              -max_total_time=60 -timeout=1
          done

  signatures:
    name: signature-walk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tools/ci/import-signing-keys.sh
      - run: tools/ci/verify-signatures.sh HEAD

  dco:
    name: dco-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tools/ci/dco-check.sh HEAD

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tools/ci/install-gitleaks.sh
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml

  repo-url:
    name: repository-url
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/check-repo-url.sh

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: aarch64-linux-android, ndk-prefix: aarch64-linux-android26 }
          - { os: ubuntu-latest, target: armv7-linux-androideabi, ndk-prefix: armv7a-linux-androideabi26 }
          - { os: ubuntu-latest, target: x86_64-linux-android, ndk-prefix: x86_64-linux-android26 }
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: macos-latest, target: x86_64-apple-darwin }
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - if: matrix.ndk-prefix
        env:
          TARGET: ${{ matrix.target }}
          NDK_PREFIX: ${{ matrix.ndk-prefix }}
        run: tools/ci/export-android-toolchain.sh
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  native-test:
    name: nextest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass
