# §17.11 stage 8: two independent runner images build the same commit with
# Nix and must produce bit-identical binaries. Pull requests stand in for the
# merge queue, which user-owned repositories cannot enable (ADR-0013).

name: reproducible-build

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    name: nix build (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix build --print-build-logs
      - run: sha256sum result/bin/* | tee sha256sums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-${{ matrix.runner }}
          path: sha256sums.txt

  compare:
    name: reproducible-build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sha256sums-*
      - run: diff sha256sums-ubuntu-24.04/sha256sums.txt sha256sums-ubuntu-22.04/sha256sums.txt
