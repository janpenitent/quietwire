name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'janpenitent/quietwire'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tools/ci/import-signing-keys.sh
      - name: Refuse unsigned tags
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git verify-tag "${GITHUB_REF_NAME}" \
            || { echo "::error::Tag ${GITHUB_REF_NAME} is not signed. Refusing."; exit 1; }
      - run: tools/ci/verify-signatures.sh "${GITHUB_REF_NAME}"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build --print-build-logs
      - run: sha256sum result/bin/*
