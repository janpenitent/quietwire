name: reuse

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  reuse-lint:
    name: reuse-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
