# §19.8 repository configuration, in the shape the GitHub REST API returns.
# Drift between this file and the live repository fails QW-C-SYS-350.

repository:
  name: quietwire
  description: Infrastructure-free, end-to-end encrypted, delay-tolerant mesh messenger
  homepage: https://github.com/janpenitent/quietwire
  private: false
  default_branch: main
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  allow_auto_merge: false
  delete_branch_on_merge: true
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
  private_vulnerability_reporting: true

actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
  sha_pinning_required: true
  approval_policy: all_external_contributors

environments:
  - name: release
    can_admins_bypass: false
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    branch_policies:
      - name: "v*"
        type: tag
    protection_rules:
      - type: required_reviewers
        prevent_self_review: false
        reviewers:
          - type: User
            reviewer:
              login: janpenitent
      - type: branch_policy

rulesets:
  - name: protected-branches
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH", "refs/heads/release/*"]
        exclude: []
    # merge_queue is rejected on user-owned repositories; add it back, in a
    # ruleset scoped to ~DEFAULT_BRANCH alone, once the repository moves to
    # an organization.
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_signatures
      - type: required_linear_history
      # Single maintainer: GitHub forbids approving your own pull request.
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: "fmt · clippy · deny · audit"
            - context: nextest
            - context: signature-walk
            - context: dco-check
            - context: repository-url
            - context: reuse-lint
            - context: secret-scan
            - context: "check aarch64-linux-android"
            - context: "check armv7-linux-androideabi"
            - context: "check x86_64-linux-android"
            - context: "check aarch64-apple-ios"
            - context: "check aarch64-apple-ios-sim"
            - context: "check x86_64-apple-darwin"
            - context: "nextest macos-latest"
            - context: "nextest windows-latest"
            # Stage 8 runs here, not in a merge queue: see ADR-0013.
            - context: reproducible-build

  - name: signed-release-tags
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include: ["refs/tags/v*"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
      - type: required_signatures
